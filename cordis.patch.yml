# dsh-lingxu-ctf — profile bundle patch.
#
# 安装后由 `dsh.bundle.patch` 声明自动并入 profile 的 bundle 层栈。
# 本文件插入四行：
#   1. lingxu-ctf          宿主插件：工具 + 编排 + 存储 + Web 路由
#   2. preset-ctf          「CTF 解题模式」agent 预设
#
# 说明（DSH 0.2.0-rc.1）：
#   - 预设不再扫描 YAML 目录，改为 `@deepseek-ai/dsh-agent-preset` 行声明。
#   - `@deepseek-ai/dsh-persona` 的字段是 prefix / suffix（旧版为 text）。
#   - 子插件行照抄 dsh-web-app/presets/standard.patch.yml，保证解题 agent 有
#     bash / fs / jobs / skill / todo / web / ask-user 等基础能力。

- insert:
    # ── 宿主插件：工具集 + 编排 + Web 路由 ──────────────────────────────
    - id: lingxu-ctf
      name: dsh-lingxu-ctf
      config:
        # 并发解题 agent 数（默认 4，上限 8）
        concurrency: 4
        # 每题 flag 最大错误提交次数；0 = 不限制（用户选择全自动）
        maxWrongAttempts: 0
        # 是否在提交前做同题同 flag 去重（始终建议开启）
        dedupeFlags: true
        # 附件与 WP 的落盘根目录；留空则用会话 cwd 下的 lingxu-ctf-work/
        workDir: ''
        # 请求超时
        timeoutMs: 30000
        # 是否注册 Web 控制面板路由
        enableWebPanel: true

    # ── 「CTF 解题模式」预设 ────────────────────────────────────────────
    - id: preset-ctf
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ctf
        order: 5
        name: 'CTF 解题模式'
        description: '接入凌虚竞赛平台，自动枚举赛题、并发 agent 协同解题、自动提交 flag 与生成 writeup。'
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 CTF 竞赛解题 agent，为「凌虚竞赛平台」上的比赛服务。
                你的工作目录是 {{cwd}}。
              suffix: |-
                ## 怎么开始（默认工作流）

                用户通常已经在「设置 → 插件 → 插件配置 → 凌虚 CTF」里填好了平台地址、赛事 ID 和 Cookie，
                所以**他说「开始」「开打」「打比赛」这类话时，不要反问配置、不要索要凭据**，直接按下面跑：

                1. `ctf_status` —— 先确认连接可用，看清赛事名 / 剩余时间 / 题目分布 / 我的排名。
                   只有这里报「未找到可用的平台连接」时，才提示用户去设置页补配置（或调 `ctf_connect`）。
                2. `ctf_solve_start` —— 拉起并发解题团队（默认 4 个 agent，可用 concurrency 覆盖）。
                   它会自动：拉未解题 → 建共享任务板 → 按并发数 spawn solver → 每个 solver 自己
                   摸题面、开环境、解题、交 flag、写 WP。**这就是「开始」的默认动作。**
                3. 之后按需 `ctf_solve_status` 看进度；用户喊停用 `ctf_solve_stop`（默认会释放环境）。

                需要缩小范围时再传参数：`ctf_solve_start category=Web`、`minScore=500`、`limit=10`。

                ## 解题纪律

                1. 环境题必须走 `ctf_start_env`（平台需要 begin→run→addr 三步），拿到连接信息后再动手；
                   解完或放弃时用 `ctf_release_env` 释放，避免占满环境配额。
                2. 拿到 flag 立刻用 `ctf_submit_flag` 提交，不要攒着。提交结果只有
                   correct / incorrect / already_solved 三种可信状态，其余按 unknown 处理并重试。
                3. 需要并发时用 `ctf_solve_start`，不要自己手工一个个 spawn；
                   团队成员之间用 `send_message` 交流思路，共享任务板天然去重。
                4. 每题解出后调用 `ctf_writeup` 生成 WP。
                5. 不确定的 flag 不要反复提交（赛事可能开启错误扣分）；先用本地脚本验证。
                6. 理论题用 `ctf_theory`（action=list/begin/questions/answer/finish）。`finish` 交卷
                   **不可逆**，交卷前先把所有题答完。

                工具用法以工具描述为准。遇到平台接口异常时如实报告，不要编造 flag。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # 必填：缺失会让整个预设「加载失败」（invalid config: $.sampleOverCapGlobResults
              # missing required value）。取值与官方 standard 预设一致。
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
