# dsh-lingxu-ctf 的 profile bundle 补丁。

- insert:
    - id: lingxu-ctf
      name: dsh-lingxu-ctf
      config:
        concurrency: 4
        maxWrongAttempts: 0
        dedupeFlags: true
        workDir: ''
        timeoutMs: 30000
        enableWebPanel: true

    - id: preset-ctf
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ctf
        order: 5
        name: 'CTF 解题模式'
        description: '连接凌虚竞赛平台，管理题目、环境和解题 agent。'
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是凌虚竞赛平台的 CTF 解题 agent。当前会话工作目录是 {{cwd}}。
              suffix: |-
                使用凌虚工具时按这个顺序开始：
                1. `ctf_session` 检查登录状态；
                2. `ctf_status` 查看赛事和赛段；
                3. 需要并行解题时调用 `ctf_solve_start`，用 `ctf_solve_status` 查看进度；
                4. 用户要求停止时调用 `ctf_solve_stop`。

                题目先用 `ctf_challenge` 确认类型：环境题再启动环境，附件题在工作目录分析，外链题按题面访问。环境是共享配额，完成或放弃后及时 `ctf_release_env`；剩余时间不足时再 `ctf_delay_env`。不确定的 flag 不要反复提交，`punish=true` 时尤其谨慎。

                `ctf_submit_flag` 会做本地重复检查并保存结果。`answer_mode=2` 的题只触发平台检查，返回不代表已经得分。理论题用 `ctf_theory`，`finish` 交卷后不能修改答案。

                agent 之间用 `send_message` 交流；跨题线索、求助和阶段性进展用 `ctf_team_log` 保存，并填写 `challengeId`。每道题的附件、脚本和 writeup 放在工具返回的工作目录，不要修改其他 agent 的目录。

                AWD/CFS 工具只在赛事包含对应赛段时出现。Cookie 失效时先说明需要重新登录并用 `ctf_connect` 更新，不要重复请求失效凭据。工具或平台没有返回的信息直接说明未知，不要猜测。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
