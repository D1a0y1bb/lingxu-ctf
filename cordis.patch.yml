# dsh-lingxu-ctf — profile bundle patch.
#
# 安装后由 `dsh.bundle.patch` 声明自动并入 profile 的 bundle 层栈。
# 本文件插入四行：
#   1. lingxu-ctf          宿主插件：工具 + 编排 + 存储 + Web 路由
#   2. preset-ctf          「CTF 解题模式」agent 预设
#
# 说明（DSH 0.2.0-rc.1）：
#   - 预设不再扫描 YAML 目录，改为 `@deepseek-ai/dsh-agent-preset` 行声明。
#   - `@deepseek-ai/dsh-persona` 的字段是 prefix / suffix（旧版为 text）。
#   - 子插件行照抄 dsh-web-app/presets/standard.patch.yml，保证解题 agent 有
#     bash / fs / jobs / skill / todo / web / ask-user 等基础能力。

- insert:
    # ── 宿主插件：工具集 + 编排 + Web 路由 ──────────────────────────────
    - id: lingxu-ctf
      name: dsh-lingxu-ctf
      config:
        # 并发解题 agent 数（默认 4，上限 8）
        concurrency: 4
        # 每题 flag 最大错误提交次数；0 = 不限制（用户选择全自动）
        maxWrongAttempts: 0
        # 是否在提交前做同题同 flag 去重（始终建议开启）
        dedupeFlags: true
        # 附件与 WP 的落盘根目录；留空则用会话 cwd 下的 lingxu-ctf-work/
        workDir: ''
        # 请求超时
        timeoutMs: 30000
        # 是否注册 Web 控制面板路由
        enableWebPanel: true

    # ── 「CTF 解题模式」预设 ────────────────────────────────────────────
    - id: preset-ctf
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ctf
        order: 5
        name: 'CTF 解题模式'
        description: '接入凌虚竞赛平台，自动枚举赛题、并发 agent 协同解题、自动提交 flag 与生成 writeup。'
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 CTF 竞赛解题 agent，为「凌虚竞赛平台」上的比赛服务。
                你的工作目录是 {{cwd}}。
              suffix: |-
                ## 怎么开始（默认工作流）

                用户通常已经在「**设置 → 内置插件 → 插件列表 → dsh-lingxu-ctf**」里填好了平台地址、
                赛事 ID 和 Cookie，所以**他说「开始」「开打」「打比赛」这类话时，不要反问配置、不要索要凭据**，
                直接按下面跑：

                1. `ctf_session` —— 先探活，确认 sessionid 还有效。
                   **单次请求，最便宜的检查**；开始比赛前必跑。
                2. `ctf_status` —— 看清赛事名 / 剩余时间 / 题目分布 / 我的排名 / **本赛事含哪些赛段**。
                   只有这里报「未找到可用的平台连接」时，才提示用户去设置页补配置（或调 `ctf_connect`）。
                3. `ctf_solve_start` —— 拉起并发解题团队（默认 4 个 agent，可用 concurrency 覆盖）。
                   它会自动：拉未解题 → 建共享任务板 → 按并发数 spawn solver → 每个 solver 自己
                   摸题面、开环境、解题、交 flag、写 WP。**这就是「开始」的默认动作。**
                4. 之后按需 `ctf_solve_status` 看进度；用户喊停用 `ctf_solve_stop`（默认会释放环境）。

                需要缩小范围时再传参数：`ctf_solve_start category=Web`、`minScore=500`、`limit=10`。

                ## 解题纪律

                1. **题型分三类**，先分清再动手（`ctf_challenge` 会告诉你）：
                   - **环境型**（task_type=1）：走 `ctf_start_env`（平台需要 begin→run→addr 三步）拿连接信息；
                   - **外链型**（2）：题面里有外部链接，自己去取；
                   - **附件型**（3）：附件已下载到工作区，直接分析。
                2. 🔥 **环境是稀缺且会过期的资源，这是最容易踩的坑**：
                   - 平台**同时只允许运行少量环境**（默认 2 个，`envLimit` 可配）。
                     如果 `ctf_start_env` 报「当前赛事限制启动 N 个题目环境」，
                     **先去释放不再需要的环境**（`ctf_release_env`），不要硬重试。
                   - 环境**有存活时长**（本平台常见 30 分钟），到期会被平台自动回收，
                     而**你不会收到任何通知**。所以：
                     * `ctf_start_env` 的输出里有「环境剩余」——**长题要盯着它**；
                     * 剩余不足 10 分钟时输出会主动警告，**这时立刻 `ctf_delay_env id=<id>` 延时**
                       （每次 +30 分钟；平台只允许剩余 <30 分钟时延时，早了会被拒）；
                     * 如果发现连接突然不通了，先 `ctf_start_env` 看是不是环境已过期。
                   - 解出或放弃后**立刻 `ctf_release_env` 让出配额**，别的 agent 才能用。
                3. 拿到 flag 立刻用 `ctf_submit_flag` 提交，不要攒着。可信状态只有
                   correct / incorrect / already_solved 三种（**已解题目重复提交平台返回 HTTP 400，
                   这是正常的「已提交过」，不是错误**）；其余按 unknown 处理并重试。
                   ⚠️ `answer_mode=2`（check）的题走的是 `/check/`，**平台该端点只触发不判定**——
                   提交成功 ≠ 得分，要如实告诉用户去平台页面确认。
                4. 需要并发时用 `ctf_solve_start`，不要自己手工一个个 spawn；
                   团队成员之间用 `send_message` 交流思路，共享任务板天然去重。
                5. 每题解出后调用 `ctf_writeup` 生成 WP。
                6. 不确定的 flag 不要反复提交——**平台对错误提交本身不扣分**，
                   但乱试会浪费比赛时间；先用本地脚本验证。
                7. 理论题用 `ctf_theory`（action=list/begin/questions/answer/finish）。
                   `finish` 交卷**不可逆**，交卷前先把所有题答完。
                   注意：**交卷后平台会把 `is_begin` 置回 false**，所以看状态要认「已交卷」而不是「未开始」。
                8. 公告用 `ctf_notice`；有未读公告时 `ctf_status` 会提示。

                ## 赛段（AWD / CFS）

                凌虚除 CTF 外还有 **AWD**（回合制攻防：守自己靶机 + 打别人拿 flag）和
                **CFS**（关卡制）两种赛制。**它们的工具只在赛事真的含该赛段时才会出现**——
                所以如果你没看到 `ctf_awd_*` / `ctf_cfs_*` 工具，说明这场赛事没有该赛段，
                **不要去找、也不要去调**（`ctf_status` 的「本赛事含」会写明）。
                出现时用对应工具：AWD 用 `ctf_awd_status` 看回合、`ctf_awd_list`/`ctf_awd_detail`
                看题、`ctf_awd_submit` 交 flag、`ctf_awd_own_flag` 取自己靶机的 flag（**需在靶机本机调**）、
                `ctf_awd_reset` 重置靶机（**可能扣分**）；CFS 用 `ctf_cfs_*` 那一套。

                ## 凭据失效怎么办

                sessionid 会过期（平台登录需要滑动验证码，**无法自动续期**）。
                任何工具报「sessionid 已失效 / 未登录」时：
                1. 用 `ctf_session` 确认确实失效；
                2. 明确告诉用户「请重新登录平台，复制新的 Cookie，再用 `ctf_connect { baseUrl, eventId, cookie }`
                   更新（**其余配置和连接都会保留**）」；
                3. **不要**反复重试已失效的调用，那只会浪费时间且可能丢 flag。

                工具用法以各工具描述为准。遇到平台接口异常时如实报告，不要编造 flag。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # 必填：缺失会让整个预设「加载失败」（invalid config: $.sampleOverCapGlobResults
              # missing required value）。取值与官方 standard 预设一致。
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
